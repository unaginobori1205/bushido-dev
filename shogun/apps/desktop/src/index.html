<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>SHOGUN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!--
      MVP0.1 UI: four states only (IDLE/LISTENING/THINKING/SPEAKING — spec
      §15-16). CONFIRMING/EXECUTING render as a generic "busy" state for now
      since MVP0.1 has no Level 1+ intents that reach them; a dedicated
      confirmation affordance is MVP0.2+ work (docs/ARCHITECTURE.md §5).

      No frontend framework/bundler for MVP0.1 — plain HTML/CSS/JS loaded
      directly by the WebView (see apps/desktop/README.md). Reassess once
      the UI grows past this.
    -->
    <main id="panel">
      <button id="settings-toggle" type="button" aria-label="接続設定" title="接続設定">⚙</button>
      <div id="dot" class="dot" data-state="IDLE"></div>
      <div id="state-label">SHOGUN</div>
      <div id="transcript" aria-live="polite"></div>
      <div id="connection-warning" hidden>core に接続できません。ローカルなら `pnpm dev:core` を起動、クラウド接続なら下の⚙で接続先を確認してください。</div>

      <!--
        Where core/orchestrator lives — local dev by default, or a
        cloud-hosted URL (docs/DEPLOYMENT.md) + shared token
        (core/orchestrator/auth.ts). See settings.js.
      -->
      <div id="settings-panel" hidden>
        <label>
          Core URL
          <input id="settings-core-url" type="text" placeholder="ws://127.0.0.1:8787 or wss://your-shogun.example.com" />
        </label>
        <label>
          Token
          <input id="settings-core-token" type="password" placeholder="CORE_AUTH_TOKEN（ローカル接続なら空でOK）" />
        </label>
        <button id="settings-save" type="button">保存して再接続</button>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
