[package]
name = "shogun-desktop"
version = "0.1.0"
description = "SHOGUN — Personal AI Concierge OS (macOS tray shell, MVP0.1)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "shogun-desktop"
path = "src/main.rs"
