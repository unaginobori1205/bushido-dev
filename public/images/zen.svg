<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-label="Zen">
  
  <defs>
    <linearGradient id="bg-zen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1320"/>
      <stop offset="0.55" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#0A1320"/>
    </linearGradient>
    <radialGradient id="glow-zen" cx="0.7" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-zen">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1280" height="900" fill="url(#bg-zen)"/>
  <rect width="1280" height="900" fill="url(#glow-zen)"/>
  
    <circle cx="640" cy="450" r="200" fill="none" stroke="#F4ECDD" stroke-width="6" stroke-linecap="round" stroke-dasharray="1180 80" opacity="0.85" transform="rotate(20 640 450)"/>
    <circle cx="640" cy="450" r="200" fill="none" stroke="#C9A24B" stroke-width="2" opacity="0.4" transform="rotate(20 640 450)"/>
  <rect width="1280" height="900" fill="transparent" filter="url(#grain-zen)"/>
  <rect x="1" y="1" width="1278" height="898" fill="none" stroke="#C9A24B" stroke-width="1" opacity="0.25"/>
  <text x="60" y="840" font-family="Georgia, serif" font-size="34" fill="#F4ECDD" opacity="0.55">Zen</text>
  <text x="60" y="876" font-family="Helvetica, Arial, sans-serif" font-size="18" letter-spacing="3" fill="#C9A24B" opacity="0.7">BUSHIDO AI · PLACEHOLDER</text>
</svg>