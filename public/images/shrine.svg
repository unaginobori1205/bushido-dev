    <line x1="400" y1="360" x2="880" y2="360" stroke="#C9A24B" stroke-width="6" opacity="0.7"/>
    <line x1="470" y1="300" x2="470" y2="720" stroke="#F4ECDD" stroke-width="10" opacity="0.85"/>
    <line x1="810" y1="300" x2="810" y2="720" stroke="#F4ECDD" stroke-width="10" opacity="0.85"/>
    <path d="M360 290 q280 -70 560 0" fill="none" stroke="#C9A24B" stroke-width="8" opacity="0.8"/>
  <rect width="1280" height="900" fill="transparent" filter="url(#grain-shrine)"/>
  <rect x="1" y="1" width="1278" height="898" fill="none" stroke="#C9A24B" stroke-width="1" opacity="0.25"/>
