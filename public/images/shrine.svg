<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-label="Shrine Culture">
  
  <defs>
    <linearGradient id="bg-shrine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1320"/>
      <stop offset="0.55" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#0A1320"/>
    </linearGradient>
    <radialGradient id="glow-shrine" cx="0.7" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-shrine">
