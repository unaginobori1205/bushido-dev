<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-label="Samurai armor — bushido &amp; culture training">
  
  <defs>
    <linearGradient id="bg-samurai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1320"/>
      <stop offset="0.55" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#0A1320"/>
    </linearGradient>
    <radialGradient id="glow-samurai" cx="0.7" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#C9A24B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C9A24B" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain-samurai">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1280" height="900" fill="url(#bg-samurai)"/>
  <rect width="1280" height="900" fill="url(#glow-samurai)"/>
  
    <path d="M520 360 q120 -90 240 0 l30 60 q-150 70 -300 0 z" fill="none" stroke="#F4ECDD" stroke-width="3" opacity="0.85"/>
    <path d="M560 300 q80 -150 -40 -210 M720 300 q-80 -150 40 -210" fill="none" stroke="#C9A24B" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
    <path d="M540 420 q100 60 200 0 l-20 160 q-80 50 -160 0 z" fill="none" stroke="#F4ECDD" stroke-width="2.5" opacity="0.7"/>
    <line x1="640" y1="430" x2="640" y2="560" stroke="#C9A24B" stroke-width="1.6" opacity="0.6"/>
  <rect width="1280" height="900" fill="transparent" filter="url(#grain-samurai)"/>
  <rect x="1" y="1" width="1278" height="898" fill="none" stroke="#C9A24B" stroke-width="1" opacity="0.25"/>
  <text x="60" y="840" font-family="Georgia, serif" font-size="34" fill="#F4ECDD" opacity="0.55">Samurai armor — bushido &amp; culture training</text>
